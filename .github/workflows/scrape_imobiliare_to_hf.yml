name: Scrape imobiliare.ro to Hugging Face

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * *"

jobs:
  check-proxy:
    runs-on: ubuntu-latest
    outputs:
      has_proxy: ${{ steps.proxy.outputs.has_proxy }}
    steps:
      - id: proxy
        name: Check proxy configuration
        env:
          SCRAPER_HTTP_PROXY: ${{ secrets.SCRAPER_HTTP_PROXY }}
        run: |
          if [ -n "$SCRAPER_HTTP_PROXY" ]; then
            echo "has_proxy=true" >> "$GITHUB_OUTPUT"
            echo "SCRAPER_HTTP_PROXY is configured; scraper jobs will run."
          else
            echo "has_proxy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping imobiliare.ro scraping because SCRAPER_HTTP_PROXY is not configured. imobiliare.ro blocks GitHub-hosted runners with HTTP 403."
          fi

  build-matrix:
    needs: check-proxy
    if: needs.check-proxy.outputs.has_proxy == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - id: targets
        name: Build target matrix
        run: |
          matrix="$(python scraper/build_matrix.py scraper/targets/imobiliare.json)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  scrape:
    name: Scrape ${{ matrix.target.county_slug }} / ${{ matrix.target.city_slug }} / ${{ matrix.target.area_slug || 'all' }}
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_REPO_ID: ${{ secrets.HF_REPO_ID }}
      SCRAPER_HTTP_PROXY: ${{ secrets.SCRAPER_HTTP_PROXY }}
      FAIL_ON_UPSTREAM_BLOCKED: "true"
      BROWSER_IMPERSONATE: "chrome"
      SITE_NAME: ${{ matrix.target.site_name }}
      COUNTY_SLUG: ${{ matrix.target.county_slug }}
      CITY_SLUG: ${{ matrix.target.city_slug }}
      AREA_SLUG: ${{ matrix.target.area_slug }}
      BATCH_SIZE: "2000"
      PAGE_WORKERS: "8"
      DETAIL_WORKERS: "8"
      DETAIL_REQUEST_DELAY_SECONDS: "0.1"
      REQUEST_DELAY_SECONDS: "0.5"
      HF_UPLOAD_OPERATION_CHUNK_SIZE: "12"
      HF_UPLOAD_CHUNK_DELAY_SECONDS: "20"
      HF_COMMIT_RETRIES: "5"
      HF_COMMIT_RETRY_FALLBACK_SECONDS: "3600"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - id: sale
        name: Run sale searches
        continue-on-error: true
        env:
          SEARCHES_JSON: ${{ toJSON(matrix.target.sale_searches) }}
        run: python -m scraper.run_target

      - id: rent
        name: Run rent searches
        if: always()
        continue-on-error: true
        env:
          SEARCHES_JSON: ${{ toJSON(matrix.target.rent_searches) }}
        run: python -m scraper.run_target

      - name: Check scraper task results
        if: always()
        run: |
          if [ "${{ steps.sale.outcome }}" != "success" ] || [ "${{ steps.rent.outcome }}" != "success" ]; then
            echo "Sale outcome: ${{ steps.sale.outcome }}"
            echo "Rent outcome: ${{ steps.rent.outcome }}"
            exit 1
          fi
